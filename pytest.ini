# Arogya AI — Pytest Configuration
# Standardized test runner configuration for backend and integration test suites

[pytest]
minversion = 8.0
testpaths =
    backend/tests
    tests

pythonpath =
    .

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    unit: Isolated component or unit test
    integration: Component integration or end-to-end API test

filterwarnings =
    # Filter external Starlette testclient httpx deprecation notice until upstream fastapi updates
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning
