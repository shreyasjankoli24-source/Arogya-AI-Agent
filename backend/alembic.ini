# Arogya AI — Alembic Database Migration Configuration
# Module 3, Phase 3.5: Alembic Migrations & Schema Management

[alembic]
# Path to migration scripts, relative to the location of this ini file
script_location = %(here)s/alembic

# Template used to generate migration file names (e.g. 0001_initial_schema.py)
file_template = %%(rev)s_%%(slug)s

# Sys.path configuration - prepend repository root and backend directory
prepend_sys_path = .

# Maximum length of characters to apply to the slug field
truncate_slug_length = 40

# Default path separator (os-dependent)
path_separator = os

# Do not store raw credentials in this file.
# The database URL is dynamically resolved in alembic/env.py via backend.app.settings.
sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
